<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chúc mừng 20/10 💐</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #ffe6f0, #ffd6e0);
      font-family: 'Comic Sans MS', cursive;
      color: #d63384;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 100px;
      font-size: 36px;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 20px;
      animation: fadeIn 3s ease-in-out;
    }

    .heart {
      position: absolute;
      color: #ff3366;
      font-size: 24px;
      animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>💖 Chúc mừng Ngày Phụ Nữ Việt Nam 20/10 💖</h1>
  <p>Chúc bạn luôn xinh đẹp, hạnh phúc và được yêu thương mỗi ngày! 🌷</p>

  <script>
    // Tạo hiệu ứng trái tim bay
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 3 + Math.random() * 2 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 300);
  </script>
</body>
</html>
